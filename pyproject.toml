[project]
name = "configkit"
version = "0.1.0"
description = "A tiny type-safe config loader for YAML and JSON files with declarative validation."
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]

[tool.setuptools.packages.find]
include = ["configkit*"]

[tool.mypy]
python_version = "3.10"
strict = true
