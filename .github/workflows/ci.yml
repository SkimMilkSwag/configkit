name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + mypy strict
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PyYAML is required for the YAML code path; pytest + mypy are the
          # test/typecheck tools. configkit itself installs from source.
          pip install .[yaml] pytest mypy

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Type-check with mypy (strict)
        run: python -m mypy --strict configkit/
